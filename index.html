  <style>

    .recurring-list li:last-child { border-bottom: 0; }

    .recurring-list small { display: block; margin-top: 3px; color: var(--faint); font-size: 10px; }
    .recurring-list strong { font-size: 12px; text-align: right; }
    .table-panel { overflow: hidden; }
    .table-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }

    .filter { display: flex; gap: 5px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 17px; border-bottom: 1px solid var(--line); text-align: right; font-size: 12px; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--faint); background: var(--surface-2); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

<script>
(function () {
  "use strict";
  var VAULT = window.__VAULT;
  var te = new TextEncoder(), td = new TextDecoder();
  function b64ToBytes(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function bytesToB64(u) {
    var s = "";
    u.forEach(function (c) { s += String.fromCharCode(c); });
    return btoa(s);
  }
  function deriveKey(pin, salt) {
    return crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: VAULT.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
  }
  function tryDecrypt(key) {
    return crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(VAULT.nonce) }, key, b64ToBytes(VAULT.data))
      .then(function (pt) { return td.decode(pt); });
  }
  function showDashboard(html) {
    var vault = document.getElementById("vault");
    vault.innerHTML = html;
    vault.hidden = false;
    var gate = document.getElementById("gate");
    if (gate) gate.remove();
    initDashboard();
  }
  function showError() {
    var err = document.getElementById("gate-err");
    err.hidden = false;
    var card = document.querySelector(".gate-card");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }
  function setBusy(b) {
    document.getElementById("unlock").disabled = b;
    document.getElementById("unlock").textContent = b ? "Unlocking…" : "Unlock";
  }
  // Simpler correct flow: derive once, optionally persist the raw key.
  function unlock(pin) {
    setBusy(true);
    var keyRef = null;
    deriveKey(pin, b64ToBytes(VAULT.salt))
      .then(function (key) { keyRef = key; return tryDecrypt(key); })
      .then(function (html) {
        if (document.getElementById("remember").checked && keyRef) {
          return crypto.subtle.exportKey("raw", keyRef).then(function (raw) {
            try { localStorage.setItem("nwd-key", bytesToB64(new Uint8Array(raw))); } catch (e) {}
            return html;
          });
        }
        return html;
      })
      .then(showDashboard)
      .catch(showError)
      .then(function () { setBusy(false); var p = document.getElementById("pin"); if (p) p.value = ""; });
  }
  document.getElementById("unlock").addEventListener("click", function () {
    var pin = document.getElementById("pin").value;
    if (!pin) return;
    unlock(pin);
  });
  document.getElementById("pin").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var pin = e.target.value; if (pin) unlock(pin); }
  });
  // Returning visit with a remembered key: try it silently.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("nwd-key"); } catch (e) {}
    if (!saved) { document.getElementById("pin").focus(); return; }
    crypto.subtle.importKey("raw", b64ToBytes(saved), "AES-GCM", true, ["decrypt"])
      .then(tryDecrypt)
      .then(showDashboard)
      .catch(function () {
        try { localStorage.removeItem("nwd-key"); } catch (e) {}
        document.getElementById("pin").focus();
      });
  })();
})();
</script>
<script>
function initDashboard() {

    (function () {
      var navButtons = document.querySelectorAll('.nav button');
      function activate(target) {
        var views = document.querySelectorAll('.view');
        navButtons.forEach(function (item) {
          var selected = item.getAttribute('data-view') === target;
          item.classList.toggle('active', selected);
          item.setAttribute('aria-pressed', selected ? 'true' : 'false');
        });
        views.forEach(function (view) { view.classList.toggle('active', view.id === target); });
      }
      navButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          activate(button.getAttribute('data-view'));
          window.scrollTo({ top: document.querySelector('.nav-wrap').offsetTop, behavior: 'smooth' });
        });
      });
      document.querySelectorAll('[data-jump]').forEach(function (button) {
        button.addEventListener('click', function () {
          activate(button.getAttribute('data-jump'));
          var focus = document.getElementById(button.getAttribute('data-focus'));
          if (focus) focus.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
      document.querySelectorAll('.themes button').forEach(function (button) {
        button.addEventListener('click', function () {
          var theme = button.getAttribute('data-theme');
          if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
          else document.documentElement.setAttribute('data-theme', theme);
          document.querySelectorAll('.themes button').forEach(function (item) { item.classList.toggle('active', item === button); });
        });
      });
      var filterButtons = document.querySelectorAll('.filter button');
      var rows = document.querySelectorAll('.holdings-panel tbody tr');
      filterButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var filter = button.getAttribute('data-filter');
          filterButtons.forEach(function (item) { item.classList.toggle('active', item === button); });
          rows.forEach(function (row) { row.style.display = filter === 'all' || row.getAttribute('data-result') === filter ? '' : 'none'; });
        });
      });
      function formatMoney(value) { return '$' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
      var apple = document.getElementById('apple-balance');
      if (apple) apple.addEventListener('input', function () {
        var amount = Math.max(Number(apple.value) || Number(apple.min), Number(apple.min));
        var liabilities = Number(apple.dataset.baseLiabilities) + amount;
        var net = Number(apple.dataset.linkedAssets) - liabilities;
        document.getElementById('apple-balance-display').textContent = amount ? formatMoney(amount) + ' owed' : 'Not entered';
        document.getElementById('command-liabilities').textContent = formatMoney(liabilities);
        document.getElementById('posture-liabilities').textContent = formatMoney(liabilities);
        document.getElementById('command-net-worth').textContent = '−' + formatMoney(Math.abs(net));
      });
      var check = document.getElementById('plan-check');
      var debt = document.getElementById('debt-percent');
      var invest = document.getElementById('invest-percent');
      function updatePlan(source) {
        var total = Math.max(Number(check.value) || Number(check.min), Number(check.min));
        var debtPct = Math.max(Number(debt.value) || Number(debt.min), Number(debt.min));
        var investPct = Math.max(Number(invest.value) || Number(invest.min), Number(invest.min));
        if (source === debt) { investPct = Math.max(Number(invest.min), Number(debt.max) - debtPct); invest.value = investPct; }
        if (source === invest) { debtPct = Math.max(Number(debt.min), Number(invest.max) - investPct); debt.value = debtPct; }
        var debtAmount = total * debtPct / Number(debt.max);
        var investAmount = total * investPct / Number(invest.max);
        document.getElementById('debt-amount').textContent = formatMoney(debtAmount);
        document.getElementById('invest-amount').textContent = formatMoney(investAmount);
        document.getElementById('flow-check-label').textContent = formatMoney(total);
        document.getElementById('flow-debt-label').textContent = formatMoney(debtAmount);
        document.getElementById('flow-invest-label').textContent = formatMoney(investAmount);
        document.getElementById('split-status').textContent = debtPct + '% debt · ' + investPct + '% invest';
        document.getElementById('debt-band').setAttribute('stroke-width', String(Math.max(debtPct, Number(debt.step))));
        document.getElementById('invest-band').setAttribute('stroke-width', String(Math.max(investPct, Number(invest.step))));
      }
      [check, debt, invest].forEach(function (input) { if (input) input.addEventListener('input', function () { updatePlan(input); }); });
      var injectedWatchlist = document.getElementById('watchlist');
      var watchTemplate = document.getElementById('watchlist-upgrade-template');
      if (!injectedWatchlist && watchTemplate) {
        injectedWatchlist = document.createElement('section');
        injectedWatchlist.className = 'view';
        injectedWatchlist.id = 'watchlist';
        injectedWatchlist.setAttribute('aria-label', 'Watchlist and January 1 plan');
        watchTemplate.parentNode.insertBefore(injectedWatchlist, watchTemplate);
      }
      if (injectedWatchlist && watchTemplate && !injectedWatchlist.querySelector('.watchlist-grid')) injectedWatchlist.appendChild(watchTemplate.content.cloneNode(true));
    })();
  
}
</script>
