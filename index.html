<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0c0f" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&amp;family=Cormorant+Garamond:wght@500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23080a0c'/%3E%3Cpath d='M18 14h18v8H26v20h10v8H18V14Zm28 0v8H36v6h10v22H28v-8h10V36H28V14h18Z' fill='%23e23b34'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #e9e7e1; --surface: #f8f7f3; --surface-2: #dedbd2; --surface-3: #c9c5bb;
      --ink: #111317; --muted: #62666c; --faint: #7a7e84; --line: #bbb8b0;
      --accent: #b42d22; --accent-ink: #fff8f3; --good: #17704a; --warn: #9d6b17; --bad: #b42d22;
      --shadow: 0 18px 50px rgba(18, 18, 16, .10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0a0c0f; --surface: #12161b; --surface-2: #1a2027; --surface-3: #242b33;
        --ink: #f0eee8; --muted: #a3a7aa; --faint: #7f858b; --line: #2d343c;
        --accent: #e34e3f; --accent-ink: #130a08; --good: #45c98a; --warn: #d8a84d; --bad: #ff6b5e;
        --shadow: 0 24px 70px rgba(0, 0, 0, .28);
      }
    }
    html[data-theme="night"] {
      color-scheme: dark;
      --bg: #0a0c0f; --surface: #12161b; --surface-2: #1a2027; --surface-3: #242b33;
      --ink: #f0eee8; --muted: #a3a7aa; --faint: #7f858b; --line: #2d343c;
      --accent: #e34e3f; --accent-ink: #130a08; --good: #45c98a; --warn: #d8a84d; --bad: #ff6b5e;
      --shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }
    html[data-theme="steel"] {
      color-scheme: dark;
      --bg: #111519; --surface: #1b2127; --surface-2: #252d35; --surface-3: #313b45;
      --ink: #f3f5f4; --muted: #b1bac0; --faint: #89949b; --line: #3a454f;
      --accent: #d9a441; --accent-ink: #171108; --good: #69c39b; --warn: #e3b354; --bad: #ed766e;
      --shadow: 0 24px 70px rgba(0, 0, 0, .24);
    }
    html[data-theme="ivory"] {
      color-scheme: light;
      --bg: #e9e7e1; --surface: #f8f7f3; --surface-2: #dedbd2; --surface-3: #c9c5bb;
      --ink: #111317; --muted: #62666c; --faint: #7a7e84; --line: #bbb8b0;
      --accent: #b42d22; --accent-ink: #fff8f3; --good: #17704a; --warn: #9d6b17; --bad: #b42d22;
      --shadow: 0 18px 50px rgba(18, 18, 16, .10);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); font-family: "Archivo", -apple-system, BlinkMacSystemFont, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    .mono { font-family: "IBM Plex Mono", monospace; }
    .shell { width: min(1600px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 72px; }
    .utility { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 2px 18px; border-bottom: 1px solid var(--line); }
    .snapshot { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .pulse { width: 7px; height: 7px; background: var(--good); border-radius: 50%; box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 14%, transparent); }
    .themes { display: flex; align-items: center; gap: 5px; }
    .themes span { color: var(--faint); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .08em; margin-right: 3px; }
    .themes button, .filter button { border: 1px solid var(--line); color: var(--muted); background: transparent; border-radius: 3px; padding: 6px 9px; cursor: pointer; font-size: 11px; font-weight: 700; }
    .themes button.active, .filter button.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .masthead { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(330px, .45fr); border-bottom: 1px solid var(--line); min-height: 360px; }
    .position { padding: 52px 50px 42px 2px; }
    .eyebrow { margin: 0 0 20px; color: var(--accent); font: 600 11px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(48px, 6.2vw, 92px); line-height: .88; letter-spacing: -.07em; max-width: 930px; font-weight: 800; }
    .lede { max-width: 760px; margin: 26px 0 0; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .status-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
    .status-chip { border: 1px solid var(--line); padding: 7px 9px; color: var(--muted); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    .status-chip b { color: var(--ink); font-weight: 600; }
    .aum-panel { position: relative; background: var(--surface); padding: 34px 30px; border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: var(--shadow); }
    .aum-panel::before { content: ""; position: absolute; top: 0; left: -1px; width: 5px; height: 104px; background: var(--accent); }
    .aum-kicker { display: block; color: var(--faint); font: 600 9px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .12em; }
    .aum-label { display: block; margin-top: 8px; color: var(--muted); font: 600 11px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .1em; }
    .aum-number { display: block; margin-top: 12px; font-size: clamp(38px, 4vw, 58px); line-height: .95; letter-spacing: -.06em; }
    .aum-note { color: var(--faint); font-size: 11px; line-height: 1.55; margin: 10px 0 0; }
    .aum-filters { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 22px; }
    .aum-filter { min-height: 34px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer; font: 600 9px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .035em; }
    .aum-filter:hover, .aum-filter:focus-visible { border-color: var(--accent); color: var(--ink); }
    .aum-filter.active { border-color: var(--ink); background: var(--ink); color: var(--bg); }
    .aum-breakdown { margin-top: 18px; }
    .aum-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .aum-row span { min-width: 0; }
    .aum-row small { display: block; margin-top: 3px; color: var(--faint); font: 600 8px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .045em; }
    .aum-row strong { color: var(--ink); white-space: nowrap; }
    .aum-empty { margin: 0; padding: 13px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .aum-company { margin-top: auto; padding-top: 18px; }
    .aum-company .aum-row { margin: 0 -10px; padding: 12px 10px; border-top: 1px solid var(--accent); background: var(--surface-2); }
    .aum-company .aum-row small { color: var(--accent); }
    .nav-wrap { position: sticky; top: 8px; z-index: 10; padding: 13px 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); }
    .nav { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; padding: 1px; background: var(--line); }
    .nav button { border: 0; background: var(--surface); color: var(--muted); padding: 14px 10px; cursor: pointer; font-size: 12px; font-weight: 800; }
    .nav button.active { color: var(--accent); background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); }
    .view { display: none; }
    .view.active { display: block; }
    .section-title { display: grid; grid-template-columns: 1fr minmax(280px, 560px); align-items: end; gap: 20px; margin: 34px 0 14px; }
    .section-title:first-child { margin-top: 20px; }
    h2 { margin: 0; font-size: 26px; letter-spacing: -.035em; }
    .section-title p { margin: 0; color: var(--muted); text-align: right; font-size: 12px; line-height: 1.5; }
    .kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .kpi { min-width: 0; padding: 24px 22px; border-right: 1px solid var(--line); }
    .kpi:last-child { border-right: 0; }
    .kpi span { display: block; min-height: 28px; color: var(--muted); font-size: 11px; line-height: 1.3; }
    .kpi strong { display: block; margin-top: 11px; font-size: clamp(22px, 2.5vw, 32px); letter-spacing: -.045em; }
    .kpi small { display: block; margin-top: 8px; color: var(--faint); font-size: 10px; line-height: 1.4; }
    .negative { color: var(--bad) !important; }
    .positive { color: var(--good) !important; }
    .warning { color: var(--warn) !important; }
    .command-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); gap: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--line); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { margin: 0; font-size: 14px; }
    .panel-head span { color: var(--faint); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    .exposure { padding: 24px 20px 20px; }
    .exposure-line { height: 18px; display: flex; overflow: hidden; background: var(--surface-2); }
    .exposure-line i { display: block; height: 100%; }
    .exposure-line .asset { flex: 1; background: var(--good); }
    .exposure-line .debt { flex: 1; background: var(--bad); }
    .legend { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; gap: 18px; }
    .legend div { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .legend b { color: var(--ink); }
    .note-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.55; }
    .priority-list { list-style: none; margin: 0; padding: 0; }
    .priority-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 1.45; }
    .priority-list li:last-child { border-bottom: 0; }
    .priority-list b { color: var(--accent); font: 600 11px "IBM Plex Mono", monospace; }
    .account-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .account { padding: 18px; border-right: 1px solid var(--line); min-width: 0; }
    .account:last-child { border-right: 0; }
    .account .name { font-size: 12px; font-weight: 800; }
    .account .type { margin-top: 4px; min-height: 28px; color: var(--faint); font-size: 10px; line-height: 1.35; }
    .account .balance { margin-top: 18px; font-size: 21px; font-weight: 800; letter-spacing: -.035em; }
    .finance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .finance-card { padding: 20px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
    .finance-card .card-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .finance-card h3 { margin: 0; font-size: 14px; }
    .finance-card .meta { margin-top: 5px; color: var(--faint); font-size: 10px; line-height: 1.45; }
    .finance-card .amount { margin-top: 28px; font-size: 29px; font-weight: 800; letter-spacing: -.045em; }
    .finance-card .detail { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .origin { display: inline-block; flex: 0 0 auto; padding: 4px 6px; border: 1px solid var(--line); color: var(--faint); font: 600 9px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .05em; }
    .manual-slot { margin-top: 18px; padding: 13px 14px; border: 1px dashed var(--warn); color: var(--warn); font: 600 12px "IBM Plex Mono", monospace; }
    .spending-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(360px, .9fr); gap: 14px; }
    .bars { padding: 18px; }
    .bar-row { display: grid; grid-template-columns: minmax(150px, .8fr) minmax(180px, 1.5fr) 92px; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .bar-row:last-child { border-bottom: 0; }
    .bar-label { color: var(--muted); font: 600 10px "IBM Plex Mono", monospace; overflow-wrap: anywhere; }
    .bar-track { height: 7px; background: var(--surface-2); }
    .bar-track i { display: block; height: 100%; background: var(--accent); }
    .bar-value { text-align: right; font-size: 11px; font-weight: 700; }
    .recurring-list { list-style: none; padding: 0; margin: 0; }
    .recurring-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .recurring-list li:last-child { border-bottom: 0; }
    .recurring-list b { display: block; font-size: 12px; }
    .recurring-list small { display: block; margin-top: 3px; color: var(--faint); font-size: 10px; }
    .recurring-list strong { font-size: 12px; text-align: right; }
    .table-panel { overflow: hidden; }
    .table-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
    .table-tools strong { font-size: 12px; }
    .filter { display: flex; gap: 5px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 17px; border-bottom: 1px solid var(--line); text-align: right; font-size: 12px; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--faint); background: var(--surface-2); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    tbody tr:last-child td { border-bottom: 0; }
    .ticker { font-weight: 800; }
    .table-total { display: flex; justify-content: space-between; gap: 15px; padding: 14px 17px; background: var(--surface-2); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .table-total strong { color: var(--ink); font-size: 13px; }
    .research-grid { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .research-item { padding: 18px 16px; border-right: 1px solid var(--line); min-width: 0; }
    .research-item:last-child { border-right: 0; }
    .research-item .symbol { color: var(--accent); font: 600 19px "IBM Plex Mono", monospace; }
    .research-item h3 { margin: 14px 0 4px; font-size: 13px; }
    .research-item p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .intelligence-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .desk { min-height: 210px; padding: 22px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; }
    .desk-num { color: var(--accent); font: 600 11px "IBM Plex Mono", monospace; }
    .desk h3 { margin: 30px 0 8px; font-size: 20px; }
    .desk p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .desk .state { margin-top: auto; padding-top: 22px; color: var(--faint); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    .bucket-list { border: 1px solid var(--line); background: var(--surface); }
    .bucket { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 72px; align-items: center; gap: 20px; padding: 17px 18px; border-bottom: 1px solid var(--line); }
    .bucket:last-child { border-bottom: 0; }
    .bucket strong { font-size: 12px; }
    .bucket-track { height: 5px; background: var(--surface-2); }
    .bucket-track i { display: block; height: 100%; background: var(--warn); }
    .bucket span { text-align: right; color: var(--warn); font: 600 11px "IBM Plex Mono", monospace; }
    .roadmap { counter-reset: road; border-top: 1px solid var(--line); }
    .roadmap-item { counter-increment: road; display: grid; grid-template-columns: 52px minmax(0, 1fr) 120px; gap: 18px; align-items: start; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .roadmap-item::before { content: counter(road, decimal-leading-zero); color: var(--accent); font: 600 13px "IBM Plex Mono", monospace; }
    .roadmap-item h3 { margin: 0 0 6px; font-size: 15px; }
    .roadmap-item p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .roadmap-item .phase { text-align: right; color: var(--faint); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    .career-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .career-card { min-height: 235px; padding: 22px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; }
    .career-card h3 { margin: 24px 0 8px; font-size: 17px; }
    .career-card .hero-number { margin: 8px 0 0; font-size: clamp(30px, 3vw, 44px); font-weight: 800; letter-spacing: -.05em; }
    .career-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .career-card .foot { margin-top: auto; padding-top: 18px; color: var(--faint); font: 600 9px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .05em; }
    .requirement-strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .requirement { padding: 17px 18px; border-right: 1px solid var(--line); }
    .requirement:last-child { border-right: 0; }
    .requirement span { display: block; color: var(--faint); font-size: 10px; }
    .requirement strong { display: block; margin-top: 8px; font-size: 14px; }
    footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 52px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 10px; line-height: 1.6; }
    footer p { margin: 0; max-width: 700px; }
    @media (min-width: 1200px) {
      .career-card { min-height: 250px; }
    }
    @media (max-width: 1100px) {
      .masthead { grid-template-columns: 1fr; }
      .position { padding: 44px 2px 38px; }
      .aum-panel { border: 1px solid var(--line); }
      .nav { grid-template-columns: repeat(4, 1fr); }
      .finance-grid, .career-grid { grid-template-columns: repeat(2, 1fr); }
      .spending-grid { grid-template-columns: 1fr; }
      .research-grid { grid-template-columns: repeat(3, 1fr); }
      .research-item { border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 1600px); padding-top: 14px; padding-bottom: 40px; }
      .utility { align-items: flex-start; }
      .snapshot { padding-top: 7px; font-size: 10px; }
      .themes span { display: none; }
      .themes button { padding: 6px 7px; font-size: 10px; }
      .position { padding-top: 36px; }
      h1 { font-size: 49px; }
      .lede { font-size: 13px; }
      .aum-panel { padding: 26px 22px; }
      .nav { grid-template-columns: repeat(2, 1fr); }
      .nav button { padding: 11px 5px; font-size: 10px; }
      .section-title { display: block; margin-top: 28px; }
      .section-title p { margin-top: 6px; text-align: left; }
      .kpi-strip, .account-grid, .finance-grid, .career-grid, .requirement-strip { grid-template-columns: 1fr; }
      .kpi, .account, .requirement { border-right: 0; border-bottom: 1px solid var(--line); }
      .kpi:last-child, .account:last-child, .requirement:last-child { border-bottom: 0; }
      .command-grid, .intelligence-grid { grid-template-columns: 1fr; }
      .legend { grid-template-columns: 1fr; gap: 8px; }
      .bar-row { grid-template-columns: 1fr 78px; gap: 7px 10px; }
      .bar-track { grid-column: 1 / -1; grid-row: 2; }
      .table-panel { background: transparent; border: 0; overflow: visible; }
      .table-panel table, .table-panel thead, .table-panel tbody, .table-panel tr, .table-panel th, .table-panel td { display: block; width: 100%; }
      .table-panel thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .table-panel tbody { display: grid; gap: 8px; }
      .table-panel tr { padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); }
      .table-panel td { display: grid; grid-template-columns: minmax(104px, 1fr) minmax(0, 1.4fr); gap: 10px; padding: 6px 0; border: 0; text-align: right; font-size: 11px; }
      .table-panel td:first-child { text-align: right; }
      .table-panel td::before { content: attr(data-label); color: var(--faint); font: 600 9px "IBM Plex Mono", monospace; text-transform: uppercase; text-align: left; }
      .table-tools, .table-total { border: 1px solid var(--line); margin-bottom: 8px; }
      .table-total { margin: 8px 0 0; }
      .research-grid { grid-template-columns: 1fr; }

    <div class="gate-card">

      <div class="gate-sub">Private office of Matt Cicero — authorized access only</div>

             autocapitalize="off" spellcheck="false" maxlength="32" />
      <div id="gate-err" class="gate-err" hidden>Wrong PIN — try again.</div>

<script>
(function () {
  "use strict";
  function start(VAULT) {
  window.__VAULT = VAULT;
  var te = new TextEncoder(), td = new TextDecoder();
  function b64ToBytes(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function bytesToB64(u) {
    var s = "";
    u.forEach(function (c) { s += String.fromCharCode(c); });
    return btoa(s);
  }
  function deriveKey(pin, salt) {
    return crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: VAULT.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
  }
  function tryDecrypt(key) {
    return crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(VAULT.nonce) }, key, b64ToBytes(VAULT.data))
      .then(function (pt) {
        if (VAULT.v === 2) {
          // Vault payload is gzip-compressed before encryption; inflate it.
          var ds = new DecompressionStream("gzip");
          var writer = ds.writable.getWriter();
          writer.write(pt);
          writer.close();
          return new Response(ds.readable).arrayBuffer().then(function (buf) {
            return td.decode(buf);
          });
        }
        return td.decode(pt);
      });
  }
  function showDashboard(html) {
    var vault = document.getElementById("vault");
    vault.innerHTML = html;
    vault.hidden = false;
    var gate = document.getElementById("gate");
    if (gate) gate.remove();
    initDashboard();
    // Dismiss the in-vault loading overlay once the dashboard is up. This
    // lives in the gate (not initDashboard) so it fires even if a page
    // script throws midway.
    setTimeout(function () {
      try {
        var l = document.getElementById("load-screen");
        if (l) {
          l.style.transition = "opacity .5s ease";
          l.style.opacity = "0";
          setTimeout(function () { l.remove(); }, 550);
        }
      } catch (e) {}
    }, 800);
  }
  function showError() {
    var err = document.getElementById("gate-err");
    err.hidden = false;
    var card = document.querySelector(".gate-card");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }
  function setBusy(b) {
    document.getElementById("unlock").disabled = b;
    document.getElementById("unlock").textContent = b ? "Unlocking…" : "Unlock";
  }
  // Simpler correct flow: derive once, optionally persist the raw key.
  function unlock(pin) {
    setBusy(true);
    var keyRef = null;
    deriveKey(pin, b64ToBytes(VAULT.salt))
      .then(function (key) { keyRef = key; return tryDecrypt(key); })

        if (document.getElementById("remember").checked && keyRef) {
          return crypto.subtle.exportKey("raw", keyRef).then(function (raw) {
            try { localStorage.setItem("nwd-key", bytesToB64(new Uint8Array(raw))); } catch (e) {}
            return html;
          });
        }
        return html;
      })
      .then(showDashboard)
      .catch(showError)
      .then(function () { setBusy(false); var p = document.getElementById("pin"); if (p) p.value = ""; });
  }
  document.getElementById("unlock").addEventListener("click", function () {
    var pin = document.getElementById("pin").value;
    if (!pin) return;
    unlock(pin);
  });
  document.getElementById("pin").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var pin = e.target.value; if (pin) unlock(pin); }
  });
  // Returning visit with a remembered key: try it silently.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("nwd-key"); } catch (e) {}
    if (!saved) { document.getElementById("pin").focus(); return; }
    crypto.subtle.importKey("raw", b64ToBytes(saved), "AES-GCM", true, ["decrypt"])
      .then(tryDecrypt)
      .then(showDashboard)
      .catch(function () {
        try { localStorage.removeItem("nwd-key"); } catch (e) {}
        document.getElementById("pin").focus();
      });
  })();
  }
  // Cache-busting: the vault is re-encrypted on every deploy (new salt), so a
  // cached vault.json would fail PIN unlock with a confusing "Wrong PIN".
  // 0c1b3725fbf2 is replaced at build time with a hash of the vault data.
  fetch("vault.json?v=0c1b3725fbf2").then(function (r) {
    if (!r.ok) throw new Error("vault.json missing");
    return r.json();
  }).then(start).catch(function () {
    var e = document.getElementById("gate-err");
    if (e) { e.hidden = false; e.textContent = "Could not load the encrypted vault. Check your connection and refresh."; }
  });
})();
