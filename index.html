  <style>

    .recurring-list li:last-child { border-bottom: 0; }

    .recurring-list small { display: block; margin-top: 3px; color: var(--faint); font-size: 10px; }
    .recurring-list strong { font-size: 12px; text-align: right; }
    .table-panel { overflow: hidden; }
    .table-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }

    .filter { display: flex; gap: 5px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 17px; border-bottom: 1px solid var(--line); text-align: right; font-size: 12px; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--faint); background: var(--surface-2); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

      --bg: #101316; --surface: #171b1f; --surface-2: #20252a; --surface-3: #2a3036;
      --ink: #eef0ee; --muted: #adb2b5; --faint: #7f878c; --line: #363d43;
      --accent: #df3a34; --accent-ink: #fff; --good: #c8cdca; --warn: #df3a34; --bad: #ef5c54;
    }
    html[data-theme="ivory"] {
      color-scheme: light;
      --bg: #e7e7e4; --surface: #f4f4f1; --surface-2: #deded9; --surface-3: #c8c8c1;
      --ink: #101214; --muted: #5f6265; --faint: #777b7e; --line: #b8b9b5;
      --accent: #c82822; --accent-ink: #fff; --good: #39423d; --warn: #c82822; --bad: #c82822;
    }
    body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .005em; }
    .shell { width: min(1600px, calc(100% - 56px)); padding-top: 18px; }
    h1, h2, h3, .nav button, .account .name, .ticker { font-family: "Archivo Narrow", sans-serif; text-transform: uppercase; letter-spacing: .015em; }
    .utility { padding-bottom: 13px; }
    .snapshot { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
    .pulse { width: 5px; height: 5px; border-radius: 0; background: var(--accent); box-shadow: none; transform: rotate(45deg); }
    .themes button, .filter button { border-radius: 0; padding: 6px 10px; text-transform: uppercase; font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .04em; }
    .themes button.active, .filter button.active { color: var(--ink); background: transparent; border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
    .masthead { grid-template-columns: minmax(0, 1.8fr) minmax(310px, .55fr); min-height: 245px; }
    .position { padding: 34px 50px 30px 2px; }
    .identity-line { display: flex; align-items: center; gap: 13px; margin-bottom: 27px; }
    .brand-mark { width: 38px; height: 38px; flex: 0 0 auto; color: var(--accent); }
    .brand-mark svg { display: block; width: 100%; height: 100%; }
    .brand-code { display: grid; gap: 3px; color: var(--ink); font: 600 10px "IBM Plex Mono", monospace; letter-spacing: .15em; text-transform: uppercase; }
    .brand-code small { color: var(--faint); font-size: 8px; letter-spacing: .13em; }
    .eyebrow { margin: 0 0 9px; color: var(--muted); font-size: 9px; }
    h1 { max-width: 800px; font-size: clamp(35px, 4vw, 54px); line-height: .96; letter-spacing: .005em; }
    .lede { max-width: 680px; margin-top: 15px; font-size: 13px; line-height: 1.5; }

    .aum-panel::before { width: 3px; height: 42px; }
    .aum-number { font-family: "Archivo Narrow", sans-serif; font-size: clamp(34px, 3.2vw, 49px); letter-spacing: .01em; }
    .aum-breakdown { margin-top: 25px; }
    .aum-row { padding: 9px 0; }
    .nav-wrap { top: 0; padding: 10px 0; backdrop-filter: blur(18px); }
    .nav { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); background: transparent; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); gap: 0; padding: 0; }
    .nav button { padding: 12px 8px 11px; font-size: 11px; letter-spacing: .06em; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 84%, transparent); }
    .nav button:last-child { border-right: 0; }
    .nav button.active { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
    .section-title { grid-template-columns: auto minmax(220px, 520px); margin: 29px 0 11px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .section-title:first-child { margin-top: 16px; }
    h2 { font-size: 20px; letter-spacing: .035em; }
    .section-title p { font-size: 10px; line-height: 1.45; }
    .panel, .finance-card, .desk, .career-card, .kpi-strip, .account-grid, .research-grid, .requirement-strip, .bucket-list { box-shadow: none; }
    .panel-head h3, .finance-card h3 { font-size: 13px; letter-spacing: .045em; }
    .kpi { padding: 18px 19px; }
    .kpi span { min-height: 22px; font: 500 9px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .04em; }
    .kpi strong { font-family: "Archivo Narrow", sans-serif; margin-top: 7px; font-size: clamp(23px, 2.2vw, 31px); letter-spacing: .01em; }
    .negative { color: var(--bad) !important; }
    .positive { color: var(--good) !important; }
    .bar-track i { background: var(--ink); opacity: .64; }
    .origin { border-radius: 0; }
    .manual-slot { border-style: solid; }
    .career-card .hero-number, .finance-card .amount, .account .balance { font-family: "Archivo Narrow", sans-serif; letter-spacing: .01em; }
    .network-panel { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
    .network-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .network-head h3 { margin: 0; font: 700 16px "Archivo Narrow", sans-serif; letter-spacing: .075em; text-transform: uppercase; }
    .network-head p { margin: 2px 0 0; color: var(--faint); font: 500 9px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .045em; }
    .network-live { display: flex; align-items: center; gap: 7px; color: var(--muted); font: 600 9px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
    .network-live::before { content: ""; width: 5px; height: 5px; background: var(--accent); transform: rotate(45deg); }
    .network-stage { position: relative; height: 590px; min-height: 420px; background: var(--bg); }
    #networkCanvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
    .network-readout { position: absolute; left: 14px; bottom: 14px; width: min(330px, calc(100% - 28px)); padding: 11px 13px; color: var(--muted); background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); pointer-events: none; }

    .network-key span::before { content: ""; display: inline-block; width: 14px; height: 1px; margin: 0 6px 3px 0; background: var(--line); }
    .network-key .key-active::before { height: 2px; background: var(--accent); }
    .network-key .key-node::before { width: 5px; height: 5px; background: var(--ink); transform: rotate(45deg); }
    .network-noscript { margin: 0; padding: 18px; color: var(--muted); font-size: 11px; }
    footer { text-transform: uppercase; font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .03em; }
    @media (max-width: 1100px) {
      .masthead { grid-template-columns: 1fr; }
      .position { padding: 30px 2px; }
      .nav { grid-template-columns: repeat(4, 1fr); }
      .network-stage { height: 540px; }
    }
    @media (max-width: 760px) {
      .shell { width: min(100% - 20px, 1600px); padding-top: 10px; }

      .themes { flex-wrap: wrap; justify-content: flex-end; }

      .brand-mark { width: 33px; height: 33px; }

      .section-title { display: block; }

      .network-head { align-items: flex-start; }
      .network-stage { height: 600px; }
      .network-readout { bottom: 10px; left: 10px; width: calc(100% - 20px); }
    }

<script>
(function () {
  "use strict";
  var VAULT = window.__VAULT;
  var te = new TextEncoder(), td = new TextDecoder();
  function b64ToBytes(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function bytesToB64(u) {
    var s = "";
    u.forEach(function (c) { s += String.fromCharCode(c); });
    return btoa(s);
  }
  function deriveKey(pin, salt) {
    return crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: VAULT.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
  }
  function tryDecrypt(key) {
    return crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(VAULT.nonce) }, key, b64ToBytes(VAULT.data))
      .then(function (pt) { return td.decode(pt); });
  }
  function showDashboard(html) {
    var vault = document.getElementById("vault");
    vault.innerHTML = html;
    vault.hidden = false;
    var gate = document.getElementById("gate");
    if (gate) gate.remove();
    initDashboard();
  }
  function showError() {
    var err = document.getElementById("gate-err");
    err.hidden = false;
    var card = document.querySelector(".gate-card");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }
  function setBusy(b) {
    document.getElementById("unlock").disabled = b;
    document.getElementById("unlock").textContent = b ? "Unlocking…" : "Unlock";
  }
  // Simpler correct flow: derive once, optionally persist the raw key.
  function unlock(pin) {
    setBusy(true);
    var keyRef = null;
    deriveKey(pin, b64ToBytes(VAULT.salt))
      .then(function (key) { keyRef = key; return tryDecrypt(key); })
      .then(function (html) {
        if (document.getElementById("remember").checked && keyRef) {
          return crypto.subtle.exportKey("raw", keyRef).then(function (raw) {
            try { localStorage.setItem("nwd-key", bytesToB64(new Uint8Array(raw))); } catch (e) {}
            return html;
          });
        }
        return html;
      })
      .then(showDashboard)
      .catch(showError)
      .then(function () { setBusy(false); var p = document.getElementById("pin"); if (p) p.value = ""; });
  }
  document.getElementById("unlock").addEventListener("click", function () {
    var pin = document.getElementById("pin").value;
    if (!pin) return;
    unlock(pin);
  });
  document.getElementById("pin").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var pin = e.target.value; if (pin) unlock(pin); }
  });
  // Returning visit with a remembered key: try it silently.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("nwd-key"); } catch (e) {}
    if (!saved) { document.getElementById("pin").focus(); return; }
    crypto.subtle.importKey("raw", b64ToBytes(saved), "AES-GCM", true, ["decrypt"])
      .then(tryDecrypt)
      .then(showDashboard)
      .catch(function () {
        try { localStorage.removeItem("nwd-key"); } catch (e) {}
        document.getElementById("pin").focus();
      });
  })();
})();
</script>
<script>
function initDashboard() {

    (function () {
      var navButtons = document.querySelectorAll('.nav button');
      var views = document.querySelectorAll('.view');
      navButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var target = button.getAttribute('data-view');
          navButtons.forEach(function (item) {
            var selected = item === button;
            item.classList.toggle('active', selected);
            item.setAttribute('aria-pressed', selected ? 'true' : 'false');
          });
          views.forEach(function (view) { view.classList.toggle('active', view.id === target); });
          window.scrollTo({ top: document.querySelector('.nav-wrap').offsetTop - 6, behavior: 'smooth' });
        });
      });
      var themeButtons = document.querySelectorAll('.themes button');
      themeButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var theme = button.getAttribute('data-theme');
          if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
          else document.documentElement.setAttribute('data-theme', theme);
          themeButtons.forEach(function (item) { item.classList.toggle('active', item === button); });
        });
      });
      var filterButtons = document.querySelectorAll('.filter button');
      var rows = document.querySelectorAll('.holdings-panel tbody tr');
      filterButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var filter = button.getAttribute('data-filter');
          filterButtons.forEach(function (item) { item.classList.toggle('active', item === button); });
          rows.forEach(function (row) { row.style.display = filter === 'all' || row.getAttribute('data-result') === filter ? '' : 'none'; });
        });
      });

      var canvas = document.getElementById('networkCanvas');
      if (canvas && canvas.getContext) {
        var ctx = canvas.getContext('2d');
        var stage = canvas.parentElement;
        var readout = document.getElementById('networkReadout');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var activeNode = null;
        var drawWidth = 0;
        var drawHeight = 0;
        var ratio = 1;
        var hqData = JSON.parse(document.getElementById('hq-data').textContent);
        var nodes = hqData.network.nodes;
        var edges = hqData.network.edges;
        var nodeMap = {};
        nodes.forEach(function (node) { nodeMap[node.id] = node; });

        function money(value) {
          return '$' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function resizeNetwork() {
          var box = stage.getBoundingClientRect();
          ratio = Math.min(window.devicePixelRatio || 1, 2);
          drawWidth = Math.max(1, Math.round(box.width));
          drawHeight = Math.max(1, Math.round(box.height));
          canvas.width = Math.round(drawWidth * ratio);
          canvas.height = Math.round(drawHeight * ratio);
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }
        function point(node, time) {
          var drift = reduceMotion ? 0 : 2.4;
          return {
            x: node.x * drawWidth + Math.sin(time * .00033 + node.p) * drift,
            y: node.y * drawHeight + Math.cos(time * .00027 + node.p) * drift
          };
        }
        function palette() {
          var styles = getComputedStyle(document.documentElement);
          return {
            bg: styles.getPropertyValue('--bg').trim(),
            ink: styles.getPropertyValue('--ink').trim(),
            muted: styles.getPropertyValue('--muted').trim(),
            faint: styles.getPropertyValue('--faint').trim(),
            line: styles.getPropertyValue('--line').trim(),
            accent: styles.getPropertyValue('--accent').trim(),
            surface: styles.getPropertyValue('--surface').trim()
          };
        }
        function isConnected(edge, id) { return edge.a === id || edge.b === id; }
        function drawNetwork(time) {
          var colors = palette();
          ctx.clearRect(0, 0, drawWidth, drawHeight);
          ctx.fillStyle = colors.bg;
          ctx.fillRect(0, 0, drawWidth, drawHeight);

          edges.forEach(function (edge) {
            var first = point(nodeMap[edge.a], time);
            var second = point(nodeMap[edge.b], time);
            var highlighted = activeNode && isConnected(edge, activeNode.id);
            var width = edge.value ? Math.max(.45, Math.min(3.6, Math.log10(edge.value + 1) - 1.1)) : .55;
            ctx.beginPath();
            ctx.moveTo(first.x, first.y);
            ctx.lineTo(second.x, second.y);
            ctx.strokeStyle = highlighted ? colors.accent : colors.line;
            ctx.globalAlpha = highlighted ? .95 : .42;
            ctx.lineWidth = highlighted ? Math.max(1.5, width) : width;
            ctx.stroke();
            if (highlighted && edge.value) {
              var progress = reduceMotion ? .55 : ((time * .00008 + edge.value * .00001) % 1);
              var px = first.x + (second.x - first.x) * progress;
              var py = first.y + (second.y - first.y) * progress;
              ctx.beginPath();
              ctx.arc(px, py, 2.2, 0, Math.PI * 2);
              ctx.fillStyle = colors.accent;
              ctx.globalAlpha = 1;
              ctx.fill();
            }
          });
          ctx.globalAlpha = 1;

          nodes.forEach(function (node) {
            var p = point(node, time);
            node._x = p.x; node._y = p.y;
            var selected = activeNode && node.id === activeNode.id;
            var connected = activeNode && edges.some(function (edge) { return isConnected(edge, activeNode.id) && isConnected(edge, node.id); });
            var radius = node.kind === 'core' ? 7 : node.kind === 'inflow' ? 5.5 : 4;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = selected ? colors.accent : colors.ink;
            ctx.globalAlpha = !activeNode || selected || connected ? 1 : .22;
            ctx.fillRect(-radius, -radius, radius * 2, radius * 2);
            if (selected) {
              ctx.strokeStyle = colors.accent;
              ctx.globalAlpha = .32;
              ctx.lineWidth = 1;
              ctx.strokeRect(-radius - 5, -radius - 5, (radius + 5) * 2, (radius + 5) * 2);
            }
            ctx.restore();
            ctx.globalAlpha = !activeNode || selected || connected ? 1 : .25;
            ctx.fillStyle = selected ? colors.accent : colors.ink;
            ctx.font = '600 9px "IBM Plex Mono", monospace';
            ctx.textBaseline = 'bottom';
            var alignRight = p.x > drawWidth * .82;
            ctx.textAlign = alignRight ? 'right' : 'left';
            var tx = p.x + (alignRight ? -9 : 9);
            ctx.fillText(node.label, tx, p.y - 1);
            ctx.fillStyle = colors.faint;
            ctx.font = '500 8px "IBM Plex Mono", monospace';
            ctx.textBaseline = 'top';
            ctx.fillText(node.value, tx, p.y + 3);
          });
          ctx.globalAlpha = 1;
          if (!reduceMotion) requestAnimationFrame(drawNetwork);
        }
        function pickNode(event) {
          var rect = canvas.getBoundingClientRect();
          var x = event.clientX - rect.left;
          var y = event.clientY - rect.top;
          var nearest = null;
          var distance = 22;
          nodes.forEach(function (node) {
            var dx = x - node._x;
            var dy = y - node._y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d < distance) { nearest = node; distance = d; }
          });
          activeNode = nearest;
          if (nearest) {
            var total = edges.filter(function (edge) { return isConnected(edge, nearest.id); }).reduce(function (sum, edge) { return sum + edge.value; }, 0);
            readout.innerHTML = '<b>' + nearest.label + ' · ' + nearest.value + '</b><span>' + (total ? 'Visible connected volume ' + money(total) + '. ' : '') + 'Active paths isolated in signal red.</span>';
            canvas.style.cursor = 'crosshair';
          } else {
            readout.innerHTML = '<b>Network standby</b><span>Move across the field to isolate a node and its connected flows.</span>';
            canvas.style.cursor = 'default';
          }
          if (reduceMotion) drawNetwork(0);
        }
        canvas.addEventListener('pointermove', pickNode);
        canvas.addEventListener('pointerdown', pickNode);
        canvas.addEventListener('pointerleave', function () {
          activeNode = null;
          readout.innerHTML = '<b>Network standby</b><span>Move across the field to isolate a node and its connected flows.</span>';
          if (reduceMotion) drawNetwork(0);
        });
        if ('ResizeObserver' in window) new ResizeObserver(function () { resizeNetwork(); if (reduceMotion) drawNetwork(0); }).observe(stage);
        else window.addEventListener('resize', function () { resizeNetwork(); if (reduceMotion) drawNetwork(0); });
        resizeNetwork();
        requestAnimationFrame(drawNetwork);
      }
    })();
  
}
</script>
</body>
</html>
