<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0a0c0f" />
  <title>Cicero HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #e9e7e1;
      --surface: #f8f7f3;
      --surface-2: #dedbd2;
      --surface-3: #c9c5bb;
      --ink: #111317;
      --muted: #62666c;
      --faint: #84888d;
      --line: #bbb8b0;
      --accent: #b42d22;
      --accent-ink: #fff8f3;
      --good: #17704a;
      --warn: #9d6b17;
      --bad: #b42d22;
      --shadow: 0 18px 50px rgba(18, 18, 16, .10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0a0c0f;
        --surface: #12161b;
        --surface-2: #1a2027;
        --surface-3: #242b33;
        --ink: #f0eee8;
        --muted: #a3a7aa;
        --faint: #757b81;
        --line: #2d343c;
        --accent: #e34e3f;
        --accent-ink: #130a08;
        --good: #45c98a;
        --warn: #d8a84d;
        --bad: #ff6b5e;
        --shadow: 0 24px 70px rgba(0, 0, 0, .28);
      }
    }
    html[data-theme="night"] {
      color-scheme: dark;
      --bg: #0a0c0f; --surface: #12161b; --surface-2: #1a2027; --surface-3: #242b33;
      --ink: #f0eee8; --muted: #a3a7aa; --faint: #757b81; --line: #2d343c;
      --accent: #e34e3f; --accent-ink: #130a08; --good: #45c98a; --warn: #d8a84d; --bad: #ff6b5e;
      --shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }
    html[data-theme="steel"] {
      color-scheme: dark;
      --bg: #111519; --surface: #1b2127; --surface-2: #252d35; --surface-3: #313b45;
      --ink: #f3f5f4; --muted: #b1bac0; --faint: #828d94; --line: #3a454f;
      --accent: #d9a441; --accent-ink: #171108; --good: #69c39b; --warn: #e3b354; --bad: #ed766e;
      --shadow: 0 24px 70px rgba(0, 0, 0, .24);
    }
    html[data-theme="ivory"] {
      color-scheme: light;
      --bg: #e9e7e1; --surface: #f8f7f3; --surface-2: #dedbd2; --surface-3: #c9c5bb;
      --ink: #111317; --muted: #62666c; --faint: #84888d; --line: #bbb8b0;
      --accent: #b42d22; --accent-ink: #fff8f3; --good: #17704a; --warn: #9d6b17; --bad: #b42d22;
      --shadow: 0 18px 50px rgba(18, 18, 16, .10);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Archivo", -apple-system, BlinkMacSystemFont, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .mono { font-family: "IBM Plex Mono", monospace; }
    .shell { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 24px 0 72px; }
    .utility {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 2px 18px; border-bottom: 1px solid var(--line);
    }
    .snapshot { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .pulse { width: 7px; height: 7px; background: var(--good); border-radius: 50%; box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 14%, transparent); }
    .themes { display: flex; align-items: center; gap: 5px; }
    .themes span { color: var(--faint); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .08em; margin-right: 3px; }
    .themes button, .filter button {
      border: 1px solid var(--line); color: var(--muted); background: transparent; border-radius: 3px;
      padding: 6px 9px; cursor: pointer; font-size: 11px; font-weight: 700;
    }
    .themes button.active, .filter button.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .masthead {
      display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .55fr);
      border-bottom: 1px solid var(--line); min-height: 360px;
    }
    .position { padding: 52px 44px 42px 2px; }
    .eyebrow { margin: 0 0 20px; color: var(--accent); font: 600 11px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(48px, 7vw, 92px); line-height: .88; letter-spacing: -.07em; max-width: 780px; font-weight: 800; }
    .lede { max-width: 650px; margin: 26px 0 0; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .status-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
    .status-chip { border: 1px solid var(--line); padding: 7px 9px; color: var(--muted); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    .status-chip b { color: var(--ink); font-weight: 600; }
    .aum-panel { position: relative; background: var(--surface); padding: 34px 30px; border-left: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); }
    .aum-panel::before { content: ""; position: absolute; top: 0; left: -1px; width: 5px; height: 104px; background: var(--accent); }
    .aum-label { color: var(--muted); font: 600 11px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .1em; }
    .aum-number { display: block; margin-top: 14px; font-size: clamp(38px, 5vw, 58px); line-height: .95; letter-spacing: -.06em; }
    .aum-note { color: var(--faint); font-size: 11px; line-height: 1.55; margin: 10px 0 0; }
    .aum-breakdown { margin-top: 42px; }
    .aum-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .aum-row strong { color: var(--ink); }
    .nav-wrap { position: sticky; top: 8px; z-index: 10; padding: 13px 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); }
    .nav { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .nav button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); padding: 14px 12px; cursor: pointer; font-size: 12px; font-weight: 800; }
    .nav button:last-child { border-right: 0; }
    .nav button.active { color: var(--accent); background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); }
    .view { display: none; }
    .view.active { display: block; }
    .section-title { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; margin: 34px 0 14px; }
    .section-title:first-child { margin-top: 20px; }
    h2 { margin: 0; font-size: 26px; letter-spacing: -.035em; }
    .section-title p { margin: 0; max-width: 460px; color: var(--muted); text-align: right; font-size: 12px; line-height: 1.5; }
    .kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .kpi { min-width: 0; padding: 24px 22px; border-right: 1px solid var(--line); }
    .kpi:last-child { border-right: 0; }
    .kpi span { display: block; min-height: 28px; color: var(--muted); font-size: 11px; line-height: 1.25; }
    .kpi strong { display: block; margin-top: 11px; font-size: clamp(22px, 3vw, 31px); letter-spacing: -.045em; }
    .negative { color: var(--bad) !important; }
    .positive { color: var(--good) !important; }
    .warning { color: var(--warn) !important; }
    .command-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(270px, .65fr); gap: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--line); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel-head h3 { margin: 0; font-size: 14px; }
    .panel-head span { color: var(--faint); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    .exposure { padding: 24px 20px 20px; }
    .exposure-line { height: 18px; display: flex; overflow: hidden; background: var(--surface-2); }
    .exposure-line i { display: block; height: 100%; }
    .exposure-line .asset { width: 20.63%; background: var(--good); }
    .exposure-line .debt { width: 79.37%; background: var(--bad); }
    .legend { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; gap: 18px; }
    .legend div { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .legend b { color: var(--ink); }
    .path { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 22px; }
    .path-top { display: flex; justify-content: space-between; gap: 18px; font-size: 12px; }
    .path-top span { color: var(--muted); }
    .path-top strong { color: var(--bad); }
    .path-track { position: relative; height: 5px; background: var(--surface-2); margin: 15px 0 8px; }
    .path-track::before { content: ""; position: absolute; left: 0; top: -5px; width: 2px; height: 15px; background: var(--bad); }
    .path-labels { display: flex; justify-content: space-between; color: var(--faint); font: 500 10px "IBM Plex Mono", monospace; }
    .priority-list { list-style: none; margin: 0; padding: 0; }
    .priority-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 1.45; }
    .priority-list li:last-child { border-bottom: 0; }
    .priority-list b { color: var(--accent); font: 600 11px "IBM Plex Mono", monospace; }
    .empty-slot { padding: 22px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.55; }
    .empty-slot strong { display: block; color: var(--ink); margin-bottom: 5px; }
    .account-grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .account { padding: 18px; border-right: 1px solid var(--line); min-width: 0; }
    .account:last-child { border-right: 0; }
    .account .name { font-size: 12px; font-weight: 800; }
    .account .type { margin-top: 4px; min-height: 28px; color: var(--faint); font-size: 10px; line-height: 1.35; }
    .account .balance { margin-top: 18px; font-size: 21px; font-weight: 800; letter-spacing: -.035em; }
    .table-panel { overflow: hidden; }
    .table-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
    .table-tools strong { font-size: 12px; }
    .filter { display: flex; gap: 5px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 17px; border-bottom: 1px solid var(--line); text-align: right; font-size: 12px; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--faint); background: var(--surface-2); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    tbody tr:last-child td { border-bottom: 0; }
    .ticker { font-weight: 800; }
    .ticker small { display: block; margin-top: 3px; color: var(--faint); font-weight: 500; }
    .table-total { display: flex; justify-content: space-between; gap: 15px; padding: 14px 17px; background: var(--surface-2); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .table-total strong { color: var(--ink); font-size: 13px; }
    .liability-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .liability { padding: 20px; background: var(--surface); border: 1px solid var(--line); }
    .liability-top { display: flex; justify-content: space-between; gap: 16px; }
    .liability h3 { margin: 0; font-size: 14px; }
    .liability p { margin: 5px 0 0; color: var(--faint); font-size: 11px; }
    .liability .owed { margin-top: 30px; font-size: 28px; font-weight: 800; letter-spacing: -.04em; }
    .liability .apr { color: var(--bad); font: 600 11px "IBM Plex Mono", monospace; }
    .research-grid { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); background: var(--surface); }
    .research-item { padding: 18px 16px; border-right: 1px solid var(--line); min-width: 0; }
    .research-item:last-child { border-right: 0; }
    .research-item .symbol { color: var(--accent); font: 600 19px "IBM Plex Mono", monospace; }
    .research-item h3 { margin: 14px 0 4px; font-size: 13px; }
    .research-item p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .intelligence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .desk { min-height: 210px; padding: 22px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; }
    .desk-num { color: var(--accent); font: 600 11px "IBM Plex Mono", monospace; }
    .desk h3 { margin: 30px 0 8px; font-size: 20px; }
    .desk p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .desk .state { margin-top: auto; padding-top: 22px; color: var(--faint); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    .bucket-list { border: 1px solid var(--line); background: var(--surface); }
    .bucket { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 72px; align-items: center; gap: 20px; padding: 17px 18px; border-bottom: 1px solid var(--line); }
    .bucket:last-child { border-bottom: 0; }
    .bucket strong { font-size: 12px; }
    .bucket-track { height: 5px; background: var(--surface-2); }
    .bucket-track i { display: block; height: 100%; background: var(--warn); }
    .bucket span { text-align: right; color: var(--warn); font: 600 11px "IBM Plex Mono", monospace; }
    .roadmap { counter-reset: road; border-top: 1px solid var(--line); }
    .roadmap-item { counter-increment: road; display: grid; grid-template-columns: 52px minmax(0, 1fr) 120px; gap: 18px; align-items: start; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .roadmap-item::before { content: counter(road, decimal-leading-zero); color: var(--accent); font: 600 13px "IBM Plex Mono", monospace; }
    .roadmap-item h3 { margin: 0 0 6px; font-size: 15px; }
    .roadmap-item p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .roadmap-item .phase { text-align: right; color: var(--faint); font: 600 10px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }
    footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 52px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 10px; line-height: 1.6; }
    footer p { margin: 0; max-width: 540px; }
    @media (max-width: 900px) {
      .masthead { grid-template-columns: 1fr; }
      .position { padding: 42px 2px 36px; }
      .aum-panel { border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .kpi-strip, .account-grid { grid-template-columns: 1fr 1fr; }
      .kpi:nth-child(2), .account:nth-child(2) { border-right: 0; }
      .kpi:nth-child(-n+2), .account:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .command-grid { grid-template-columns: 1fr; }
      .research-grid { grid-template-columns: 1fr 1fr; }
      .research-item { border-bottom: 1px solid var(--line); }
      .research-item:nth-child(even) { border-right: 0; }
      .research-item:last-child { grid-column: 1 / -1; border-bottom: 0; }
    }
    @media (max-width: 680px) {
      .shell { width: min(100% - 22px, 1180px); padding-top: 14px; padding-bottom: 40px; }
      .utility { align-items: flex-start; }
      .snapshot { padding-top: 7px; }
      .themes span { display: none; }
      .themes button { padding: 6px 7px; font-size: 10px; }
      .position { padding-top: 36px; }
      h1 { font-size: 51px; }
      .lede { font-size: 13px; }
      .aum-panel { padding: 26px 22px; }
      .nav button { padding: 12px 3px; font-size: 10px; }
      .section-title { display: block; margin-top: 28px; }
      .section-title p { margin-top: 6px; text-align: left; }
      .kpi { padding: 18px 14px; }
      .kpi strong { font-size: 21px; }
      .account-grid { grid-template-columns: 1fr 1fr; }
      .account { padding: 15px; }
      .account .balance { font-size: 18px; }
      .liability-grid, .intelligence-grid { grid-template-columns: 1fr; }
      .table-panel { background: transparent; border: 0; overflow: visible; }
      .table-panel table, .table-panel thead, .table-panel tbody, .table-panel tr, .table-panel th, .table-panel td { display: block; width: 100%; }
      .table-panel thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .table-panel tbody { display: grid; gap: 8px; }
      .table-panel tr { padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); }
      .table-panel td { display: grid; grid-template-columns: minmax(78px, 1fr) minmax(0, 1.3fr); gap: 10px; padding: 6px 0; border: 0; text-align: right; font-size: 11px; }
      .table-panel td:first-child { text-align: right; }
      .table-panel td::before { content: attr(data-label); color: var(--faint); font: 600 9px "IBM Plex Mono", monospace; text-transform: uppercase; text-align: left; }
      .ticker small { display: none; }
      .table-tools, .table-total { border: 1px solid var(--line); margin-bottom: 8px; }
      .table-total { margin: 8px 0 0; }
      .research-grid { grid-template-columns: 1fr; }
      .research-item, .research-item:nth-child(even), .research-item:last-child { grid-column: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .research-item:last-child { border-bottom: 0; }
      .bucket { grid-template-columns: 1fr 64px; gap: 10px; }
      .bucket-track { grid-column: 1 / -1; grid-row: 2; }
      .roadmap-item { grid-template-columns: 36px minmax(0, 1fr); }
      .roadmap-item .phase { grid-column: 2; text-align: left; }
      footer { display: block; }
      footer p + p { margin-top: 8px; }
    }
    @media (max-width: 390px) {
      h1 { font-size: 45px; }
      .themes button { padding: 6px 5px; }
      .nav button { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
    <style>
    #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0e1116;padding:24px;font-family:-apple-system,BlinkMacSystemFont,
      "SF Pro Text",Inter,system-ui,sans-serif}
    .gate-card{width:100%;max-width:340px;background:#161b22;border:1px solid #2a3139;
      border-radius:16px;padding:32px 28px;text-align:center}
    .gate-lock{font-size:34px;margin-bottom:12px}
    .gate-title{color:#e8ecf1;font-size:20px;font-weight:700;margin-bottom:6px}
    .gate-sub{color:#9aa4b2;font-size:13px;margin-bottom:22px}
    #pin{width:100%;box-sizing:border-box;background:#0e1116;border:1px solid #2a3139;
      border-radius:10px;color:#e8ecf1;font-size:24px;letter-spacing:10px;text-align:center;
      padding:12px 8px;outline:none}
    #pin:focus{border-color:#3b82f6}
    #unlock{width:100%;margin-top:16px;background:#3b82f6;border:0;border-radius:10px;
      color:#fff;font-size:16px;font-weight:600;padding:13px;cursor:pointer}
    #unlock:disabled{opacity:.55;cursor:default}
    .gate-err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:18px}
    .gate-remember{display:flex;align-items:center;justify-content:center;gap:8px;
      color:#9aa4b2;font-size:13px;margin-top:14px;cursor:pointer}
    .gate-remember input{accent-color:#3b82f6;width:16px;height:16px}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
      75%{transform:translateX(7px)}}
    .shake{animation:shake .3s}

    .wl-sub{color:#9aa4b2;font-size:13px;margin:4px 0 6px;line-height:1.5}
    .wl-bucket{color:#e8ecf1;font-size:15px;margin:22px 0 10px;display:flex;
      justify-content:space-between;align-items:baseline;gap:12px}
    .wl-weight{color:#9aa4b2;font-size:12px;font-weight:400;white-space:nowrap}
    .wl-list{display:flex;flex-direction:column;gap:8px}
    .wl-row{display:flex;gap:12px;align-items:center;background:#161b22;
      border:1px solid #2a3139;border-radius:12px;padding:12px 14px}
    .wl-tick{font-weight:700;color:#e8ecf1;min-width:62px;font-size:15px}
    .wl-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
    .wl-body strong{color:#e8ecf1;font-size:14px}
    .wl-body span{color:#9aa4b2;font-size:12.5px;line-height:1.45}
    .wl-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;
      white-space:nowrap;flex-shrink:0}
    .wl-badge.researching{background:rgba(59,130,246,.15);color:#7aa7f8}
    .wl-badge.speculative{background:rgba(245,166,35,.16);color:#f5b94f}
    .wl-badge.monitor{background:rgba(154,164,178,.16);color:#9aa4b2}
    .wl-owned{color:#9aa4b2;font-size:12.5px;margin-top:20px;line-height:1.55;
      border-top:1px solid #2a3139;padding-top:14px}

<script>
(function () {
  "use strict";
  var VAULT = window.__VAULT;
  var te = new TextEncoder(), td = new TextDecoder();
  function b64ToBytes(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function bytesToB64(u) {
    var s = "";
    u.forEach(function (c) { s += String.fromCharCode(c); });
    return btoa(s);
  }
  function deriveKey(pin, salt) {
    return crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: VAULT.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
  }
  function tryDecrypt(key) {
    return crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(VAULT.nonce) }, key, b64ToBytes(VAULT.data))
      .then(function (pt) { return td.decode(pt); });
  }
  function showDashboard(html) {
    var vault = document.getElementById("vault");
    vault.innerHTML = html;
    vault.hidden = false;
    var gate = document.getElementById("gate");
    if (gate) gate.remove();
    initDashboard();
  }
  function showError() {
    var err = document.getElementById("gate-err");
    err.hidden = false;
    var card = document.querySelector(".gate-card");
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }
  function setBusy(b) {
    document.getElementById("unlock").disabled = b;
    document.getElementById("unlock").textContent = b ? "Unlocking…" : "Unlock";
  }
  // Simpler correct flow: derive once, optionally persist the raw key.
  function unlock(pin) {
    setBusy(true);
    var keyRef = null;
    deriveKey(pin, b64ToBytes(VAULT.salt))
      .then(function (key) { keyRef = key; return tryDecrypt(key); })
      .then(function (html) {
        if (document.getElementById("remember").checked && keyRef) {
          return crypto.subtle.exportKey("raw", keyRef).then(function (raw) {
            try { localStorage.setItem("nwd-key", bytesToB64(new Uint8Array(raw))); } catch (e) {}
            return html;
          });
        }
        return html;
      })
      .then(showDashboard)
      .catch(showError)
      .then(function () { setBusy(false); var p = document.getElementById("pin"); if (p) p.value = ""; });
  }
  document.getElementById("unlock").addEventListener("click", function () {
    var pin = document.getElementById("pin").value;
    if (!pin) return;
    unlock(pin);
  });
  document.getElementById("pin").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var pin = e.target.value; if (pin) unlock(pin); }
  });
  // Returning visit with a remembered key: try it silently.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("nwd-key"); } catch (e) {}
    if (!saved) { document.getElementById("pin").focus(); return; }
    crypto.subtle.importKey("raw", b64ToBytes(saved), "AES-GCM", true, ["decrypt"])
      .then(tryDecrypt)
      .then(showDashboard)
      .catch(function () {
        try { localStorage.removeItem("nwd-key"); } catch (e) {}
        document.getElementById("pin").focus();
      });
  })();
})();
</script>
<script>
function initDashboard() {

    (function () {
      var navButtons = document.querySelectorAll('.nav button');
      var views = document.querySelectorAll('.view');
      navButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var target = button.getAttribute('data-view');
          navButtons.forEach(function (item) {
            var selected = item === button;
            item.classList.toggle('active', selected);
            item.setAttribute('aria-pressed', selected ? 'true' : 'false');
          });
          views.forEach(function (view) { view.classList.toggle('active', view.id === target); });
          window.scrollTo({ top: document.querySelector('.nav-wrap').offsetTop - 6, behavior: 'smooth' });
        });
      });

      var themeButtons = document.querySelectorAll('.themes button');
      themeButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var theme = button.getAttribute('data-theme');
          if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
          else document.documentElement.setAttribute('data-theme', theme);
          themeButtons.forEach(function (item) { item.classList.toggle('active', item === button); });
        });
      });

      var filterButtons = document.querySelectorAll('.filter button');
      var rows = document.querySelectorAll('.holdings-panel tbody tr');
      filterButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var filter = button.getAttribute('data-filter');
          filterButtons.forEach(function (item) { item.classList.toggle('active', item === button); });
          rows.forEach(function (row) {
            row.style.display = filter === 'all' || row.getAttribute('data-result') === filter ? '' : 'none';
          });
        });
      });
    })();
  
}
</script>
