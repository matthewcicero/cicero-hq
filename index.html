            <article class="intel-pair"><b>Commentary</b><strong>MoistCr1TiKaL → Asmongold</strong><span>Edited reaction and internet culture without requiring a live stream.</span></article>
          </div>
          <p class="intel-method">Recommendation contract: each future pick should name the taste signal it matches, state whether its numbers are verified, and keep open questions visibly open.</p>
        </section>
      </section>`;
      html = html.replace('</head>', intelStyle + '</head>');
      html = html.replace('<button type="button" data-view="watchlist"', intelNav + '<button type="button" data-view="watchlist"');
      html = html.replace(/<section class="view" id="watchlist"/, intelSection + '<section class="view" id="watchlist"');
      return html;
    }

    function bindIntel(doc) {
      var buttons = doc.querySelectorAll('.intel-filter');
      var cards = doc.querySelectorAll('.intel-rec');
      buttons.forEach(function (button) {
        button.addEventListener('click', function () {
          var filter = button.getAttribute('data-intel-filter');
          buttons.forEach(function (item) {
            var selected = item === button;
            item.classList.toggle('active', selected);
            item.setAttribute('aria-pressed', selected ? 'true' : 'false');
          });
          cards.forEach(function (card) {
            var topics = (card.getAttribute('data-intel-topic') || '').split(' ');
            card.hidden = filter !== 'all' && topics.indexOf(filter) === -1;
          });
        });
      });
    }

    function b64ToBytes(value) {
      var raw = atob(value);
      var bytes = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i += 1) bytes[i] = raw.charCodeAt(i);
      return bytes;
    }

    function setBusy(isBusy) {
      document.body.classList.toggle("busy", isBusy);
      pin.disabled = isBusy;
      unlock.disabled = isBusy;
      unlock.textContent = isBusy ? "Unlocking" : "Unlock";
    }

    function genericFailure() {
      failures += 1;
      if (failures >= 5) blockedUntil = Date.now() + 30000;
      message.textContent = "Unable to unlock. Check your access and try again.";
      pin.value = "";
      window.setTimeout(function () { if (!pin.disabled) pin.focus(); }, 0);
    }

    function resetIdle() {
      if (idleTimer) window.clearTimeout(idleTimer);
      idleTimer = window.setTimeout(lockDashboard, IDLE_MS);
    }

    function bindActivity() {
      if (!frame || !frame.contentWindow) return;
      ["pointerdown", "keydown", "touchstart", "wheel"].forEach(function (eventName) {
        try { frame.contentWindow.addEventListener(eventName, resetIdle, { passive: true }); } catch (error) {}
      });
      try { bindIntel(frame.contentDocument); } catch (error) {}
    }

    function showDashboard(html) {
      message.textContent = "";
      pin.value = "";
      gate.hidden = true;
      frame = document.createElement("iframe");
      frame.className = "dashboard-frame";
      frame.title = "Cicero HQ";
      frame.setAttribute("referrerpolicy", "no-referrer");
      frame.addEventListener("load", bindActivity, { once: true });
      html = installIntelPage(html);
      frame.srcdoc = html;
      document.body.appendChild(frame);
      lockButton = document.createElement("button");
      lockButton.type = "button";
      lockButton.className = "lock-button";
      lockButton.textContent = "Lock HQ";
      lockButton.addEventListener("click", lockDashboard);
      document.body.appendChild(lockButton);
      html = "";
      resetIdle();
      window.scrollTo(0, 0);
    }

    function lockDashboard() {
      if (idleTimer) window.clearTimeout(idleTimer);
      idleTimer = null;
      if (frame) {
        try { frame.srcdoc = ""; } catch (error) {}
        frame.remove();
        frame = null;
      }
      if (lockButton) {
        lockButton.remove();
        lockButton = null;
      }
      gate.hidden = false;
      document.body.classList.remove("busy");
      failures = 0;
      blockedUntil = 0;
      message.textContent = "";
      pin.disabled = false;
      unlock.disabled = false;
      unlock.textContent = "Unlock";
      pin.value = "";
      window.scrollTo(0, 0);
      pin.focus();
    }

    function decrypt(pinValue) {
      var salt = b64ToBytes(vault.salt);
      var nonce = b64ToBytes(vault.nonce);
      var encrypted = b64ToBytes(vault.data);
      return crypto.subtle.importKey("raw", encoder.encode(pinValue), "PBKDF2", false, ["deriveKey"])
        .then(function (baseKey) {
          return crypto.subtle.deriveKey(
            { name:"PBKDF2", salt:salt, iterations:vault.iter, hash:"SHA-256" },
            baseKey,
            { name:"AES-GCM", length:256 },
            false,
            ["decrypt"]
          );
        })
        .then(function (key) {
          return crypto.subtle.decrypt({ name:"AES-GCM", iv:nonce }, key, encrypted);
        })
        .then(function (compressed) {
          if (vault.v !== 2 || vault.enc !== "gzip" || typeof DecompressionStream === "undefined") throw new Error("unsupported");
          var stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
          return new Response(stream).arrayBuffer();
        })
        .then(function (plain) { return decoder.decode(plain); });
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!vault || Date.now() < blockedUntil || !pin.value) {
        genericFailure();
        return;
      }
      var candidate = pin.value;
      setBusy(true);
      decrypt(candidate)
        .then(function (html) {
          failures = 0;
          blockedUntil = 0;
          showDashboard(html);
        })
        .catch(genericFailure)
        .then(function () { setBusy(false); candidate = ""; });
    });

    fetch(VAULT_URL, { cache:"no-store", credentials:"same-origin" })
      .then(function (response) {
        if (!response.ok) throw new Error("vault unavailable");
        return response.json();
      })
      .then(function (payload) {
        if (!payload || payload.v !== 2 || payload.enc !== "gzip") throw new Error("vault invalid");
        vault = payload;
        pin.focus();
      })
      .catch(function () {
        message.textContent = "Encrypted data is unavailable. Refresh and try again.";
        pin.disabled = true;
        unlock.disabled = true;
      });
  })();
  </script>
</body>
</html>
